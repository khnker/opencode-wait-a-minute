name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.1.0-rc.1). Must match an existing tag v<version>."
        required: true
      dist_tag:
        description: "npm dist-tag. Leave empty to auto-select (next for prereleases, latest for stable)."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: wait-a-minute
  NPM_TOKEN: ${{ secrets.NPM_SECRET }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      # Configure npm with the Automation token so that `npm publish`
      # works on Node 20 (npm 10.x) which does not support Trusted Publishing/OIDC.
      - name: Configure npm with NPM_TOKEN
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          npm whoami

      # OpenCode Smoke E2E is skipped on GitHub Actions (no configured provider);
      # the release gate enforces it only where a real provider is available.
      - name: Run unified release gate
        run: npm run gate

      - name: Run smoke check
        run: npm run smoke

      - name: Test packaged artifact
        run: npm run pack:test

      - name: Verify package metadata
        run: node -e "const p=require('./package.json'); for (const k of ['repository','license','engines']) { if(!p[k]) { console.error('missing '+k); process.exit(1);} } console.log('metadata ok')"

      - name: Determine version and dist-tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            DIST_TAG="${{ github.event.inputs.dist_tag }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            DIST_TAG=""
          fi
          if [ -z "${DIST_TAG}" ]; then
            case "${VERSION}" in
              *-*) DIST_TAG="next" ;;
              *)   DIST_TAG="latest" ;;
            esac
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "DIST_TAG=${DIST_TAG}" >> "$GITHUB_ENV"
          echo "Publishing ${PACKAGE_NAME}@${VERSION} with dist-tag ${DIST_TAG}"

      - name: Sync package.json version to the release version
        run: npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Publish to npm (Automation token)
        run: npm publish --access public --tag "${DIST_TAG}"

      - name: Wait for registry to serve the published version
        run: |
          for i in $(seq 1 30); do
            if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
              echo "${PACKAGE_NAME}@${VERSION} is available on the registry"
              exit 0
            fi
            echo "attempt ${i}/30: ${PACKAGE_NAME}@${VERSION} not yet available, retrying in 10s..."
            sleep 10
          done
          echo "timed out waiting for ${PACKAGE_NAME}@${VERSION}" >&2
          exit 1

      - name: Verify published artifact
        run: npm run verify:published -- "${PACKAGE_NAME}@${VERSION}"