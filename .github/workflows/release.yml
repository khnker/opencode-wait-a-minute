name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run unit/invariant tests
        run: npm test

      # OpenCode E2E is required; CI must provide a real provider.
      # OpenCode E2E is required; CI must provide a real provider.
      - name: Run unified release gate
        run: npm run gate

      - name: Verify package metadata
        run: node -e "const p=require('./package.json'); for (const k of ['repository','license','engines']) { if(!p[k]) { console.error('missing '+k); process.exit(1);} } console.log('metadata ok')"

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: npm publish --provenance --access public