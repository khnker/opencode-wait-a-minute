name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit/invariant tests
        run: npm test
        env:
          WAM_TEST_PER_FILE: "1"
          WAM_TEST_LOG: test-output.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
          if-no-files-found: ignore

      # OpenCode Smoke E2E is skipped on GitHub Actions (no configured provider);
      # the release gate enforces it only where a real provider is available.
      - name: Run unified release gate
        run: npm run gate
