name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit/invariant tests
        run: npm test

      # OpenCode Smoke E2E is skipped on GitHub Actions (no configured provider);
      # the release gate enforces it only where a real provider is available.
      - name: Run unified release gate
        run: npm run gate
