name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CI has no model provider; the real OpenCode round-trip E2E is exercised locally.
      WAM_SKIP_OPENCODE_E2E: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit/invariant tests
        run: npm test

      - name: Run unified release gate
        run: npm run gate