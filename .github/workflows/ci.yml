name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit/invariant tests
        run: npm test

      # OpenCode E2E is required; CI must provide a real provider.
      # OpenCode E2E is required; CI must provide a real provider.
      - name: Run unified release gate
        run: npm run gate