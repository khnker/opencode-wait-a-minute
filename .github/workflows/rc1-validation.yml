name: RC1 Validation

on:
  workflow_dispatch:
  push:
    tags:
      - "v1.1.0-rc.*"

permissions:
  contents: read

jobs:
  rc1-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # OpenCode Smoke E2E is skipped on GitHub Actions (no configured provider);
      # the release gate enforces it only where a real provider is available.
      - name: Run unified RC1 release gate
        run: npm run gate

      - name: Generate RC1 evidence bundle
        run: npm run report:rc1

      - name: Upload RC1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: rc1-evidence
          path: benchmarks/reports/rc1/
          if-no-files-found: error
